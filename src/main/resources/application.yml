app:
  async:
    core-pool-size: 5
    max-pool-size: 10
    queue-capacity: 100

spring:
  application:
    name: hhplus
  profiles:
    active: local
  kafka:
    bootstrap-servers: localhost:9092
    topic:
      payment-completed: payment-completed
    consumer:
      auto-startup: true
  datasource:
    name: HangHaePlusDataSource
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      maximum-pool-size: 3
      connection-timeout: 10000
      max-lifetime: 60000
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.timezone.default_storage: NORMALIZE_UTC
      hibernate.jdbc.time_zone: UTC
  data:
    redis:
      host: localhost
      port: 6379
      password:  # 로컬은 비밀번호 없음
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

---
spring.config.activate.on-profile: local, test

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/hhplus?characterEncoding=UTF-8&serverTimezone=UTC
    username: application
    password: application
    # SQL 스크립트 자동 실행 (선택)
    # initialization-mode: always  # 항상 실행
    # schema: classpath:sql/schema.sql  # 스키마 파일 경로
  jpa:
    hibernate:
      ddl-auto: update  # 개발용: 엔티티 변경 시 자동 업데이트
    show-sql: true  # 개발용: SQL 로그 출력
    properties:
      hibernate:
        format_sql: true  # SQL 포맷팅
  data:
    redis:
      host: localhost
      port: 6379


---
spring.config.activate.on-profile: prod

# 운영 환경: 부하 테스트 기반 병목 개선 설정
spring:
  datasource:
    hikari:
      maximum-pool-size: 20        # 기본 3 → 20 (동시 예약/결제 트래픽 대응)
      minimum-idle: 5
      connection-timeout: 10000
      max-lifetime: 60000
      idle-timeout: 300000
  data:
    redis:
      lettuce:
        pool:
          max-active: 32           # 기본 8 → 32 (분산락/랭킹/멱등성 동시 접근)
          max-idle: 16
          min-idle: 4

# TaskExecutor: prod에서 core=10, max=20, queue=500 적용
app:
  async:
    core-pool-size: 10
    max-pool-size: 20
    queue-capacity: 500

---
spring.config.activate.on-profile: h2

app:
  event:
    provider: spring-event  # 테스트 시 Kafka 대신 Spring Event 사용

spring:
  kafka:
    consumer:
      auto-startup: false  # 테스트 시 Kafka 미실행 가능
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: localhost
      port: 6379
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect